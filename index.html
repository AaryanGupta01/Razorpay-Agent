<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Agentic Commerce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;500;600&display=swap');

        /* 1. Razorpay Dark FinTech Theme */
        :root {
            --rzp-bg-dark: #070B19; 
            --rzp-bg-light: #111A3A;
            --rzp-primary: #3366FF; /* Razorpay Blue */
            --rzp-accent: #00E676; /* Success Green */
            --text-main: #F8FAFC;
            --text-slate: #94A3B8;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--rzp-bg-dark);
            /* High-tech radial gradient background */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(51, 102, 255, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 230, 118, 0.1), transparent 25%);
        }

        /* 2. Sleek Hero Layout */
        #hero-background {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(51, 102, 255, 0.1);
            border: 1px solid rgba(51, 102, 255, 0.3);
            color: var(--rzp-primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(51, 102, 255, 0.2);
        }

        .hero-line-1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5vw;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .typewriter-text {
            color: var(--rzp-primary);
            background: -webkit-linear-gradient(45deg, #3366FF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cursor {
            color: var(--rzp-primary);
            animation: blink 1s step-end infinite;
        }

        .language-row {
            margin-top: 30px;
            font-size: 1vw;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--text-slate);
            text-transform: uppercase;
        }

        /* 3. Modern Glassmorphic Mic Component */
        #mic-container {
            position: fixed;
            bottom: 40px;
            right: 80px; 
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #mic-btn {
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(135deg, var(--rzp-primary), #1A368F);
            color: white;
            box-shadow: 0 8px 32px rgba(51, 102, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        #mic-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 40px rgba(51, 102, 255, 0.6);
        }

        #mic-btn:active {
            transform: scale(0.95);
        }

        #mic-btn.recording {
            background: linear-gradient(135deg, #FF3366, #D91848); 
            border-color: rgba(255, 51, 102, 0.5);
            animation: pulse-red 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(255, 51, 102, 0.5);
        }

        /* 4. Glassmorphic Status Pill */
        #mic-status {
            background: rgba(17, 26, 58, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease;
        }

        /* Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        flowise-fullpagechat {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    
    <div id="hero-background">
        <div class="hero-line-1">Resolve payments &</div>
        <div class="hero-line-1">analyze reports in <span class="typewriter-text" id="typewriter"></span><span class="cursor">|</span></div>
        <div class="language-row">ENGLISH &middot; हिंदी &middot; मराठी &middot; தமிழ் &middot; తెలుగు &middot; বাংলা</div>
    </div>
    
    <flowise-fullpagechat></flowise-fullpagechat>

    <div id="mic-container">
        <span id="mic-status"></span>
        <button id="mic-btn" title="Click to dictate">🎙️</button>
    </div>

    <!-- Typewriter Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const languages = ["English", "Hindi", "Marathi", "Punjabi", "Gujarati", "Tamil", "Telugu", "Bengali"];
            const typewriterElement = document.getElementById("typewriter");
            
            let languageIndex = 0;
            let charIndex = 0;
            let isDeleting = false;
            let typeSpeed = 100;

            function typeWriter() {
                const currentLanguage = languages[languageIndex];
                
                if (isDeleting) {
                    typewriterElement.textContent = currentLanguage.substring(0, charIndex - 1);
                    charIndex--;
                    typeSpeed = 40; 
                } else {
                    typewriterElement.textContent = currentLanguage.substring(0, charIndex + 1);
                    charIndex++;
                    typeSpeed = 100; 
                }

                if (!isDeleting && charIndex === currentLanguage.length) {
                    isDeleting = true;
                    typeSpeed = 2000; 
                } 
                else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    languageIndex = (languageIndex + 1) % languages.length; 
                    typeSpeed = 400; 
                }
                setTimeout(typeWriter, typeSpeed);
            }
            setTimeout(typeWriter, 800);
        });
    </script>

    <!-- Flowise Initialization (Updated for Dark FinTech Theme) -->
    <script type="module">
        import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

        fetch('/api/config')
            .then(response => response.json())
            .then(config => {
                const getThemeConfig = () => ({

                    apiHost: config.apiHost,       
                    theme: {

                            button svg, svg.text-white {

                                stroke: #3366FF !important;
                            }

                });

                Chatbot.initFull(getThemeConfig());
            })
            .catch(err => console.error("Failed to load bot config:", err));
    </script>

    <!-- Keep your exact Microphone STT Script here -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('mic-btn');
            const micStatus = document.getElementById('mic-status');
            
            let isRecording = false;
            let mediaRecorder;
            let audioChunks = [];

            micBtn.addEventListener('click', async () => {
                if (!isRecording) {
                    await startRecording();
                } else {
                    stopRecording();
                }
            });

            async function startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const options = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {};
                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        await sendAudioToBackend(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    
                    micBtn.classList.add('recording');
                    micStatus.style.display = 'block';
                    micStatus.textContent = "Listening...";
                } catch (err) {
                    console.error("Mic Error:", err);
                    micStatus.style.display = 'block';
                    micStatus.textContent = "Mic permission denied.";
                    setTimeout(() => { micStatus.style.display = 'none'; }, 3000);
                }
            }

            function stopRecording() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    isRecording = false;
                    
                    micBtn.classList.remove('recording');
                    micStatus.textContent = "Processing audio...";
                }
            }

            async function sendAudioToBackend(blob) {
                const formData = new FormData();
                formData.append('file', blob, 'recording.webm');

                try {
                    micStatus.textContent = "Transcribing...";
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    const response = await fetch('/v1/audio/transcriptions', {
                        method: 'POST',
                        body: formData,
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    const contentType = response.headers.get("content-type");
                    if (!contentType || !contentType.includes("application/json")) {
                        throw new Error("Server crashed or returned invalid format.");
                    }

                    const data = await response.json();
                    
                    if (data.text) {
                        micStatus.style.display = 'none';
                        injectTextIntoFlowise(data.text);
                    } else {
                        throw new Error(data.error || "Empty response.");
                    }
                } catch (err) {
                    console.error("API Error:", err);
                    micStatus.textContent = "Error: " + err.message; 
                    setTimeout(() => { micStatus.style.display = 'none'; }, 5000);
                }
            }

            function injectTextIntoFlowise(text) {
                try {
                    function findInputBox(rootNode) {
                        let box = rootNode.querySelector('textarea');
                        if (box) return box;
                        const allElements = rootNode.querySelectorAll('*');
                        for (let el of allElements) {
                            if (el.shadowRoot) {
                                let found = findInputBox(el.shadowRoot);
                                if (found) return found;
                            }
                        }
                        return null; 
                    }

                    const textarea = findInputBox(document);

                    if (textarea) {
                        textarea.focus();
                        const textToInsert = textarea.value.length > 0 ? " " + text : text;
                        
                        const success = document.execCommand('insertText', false, textToInsert);
                        
                        if (!success) {
                            const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
                            nativeInputValueSetter.call(textarea, textarea.value + textToInsert);
                            textarea.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
                            textarea.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
                        }
                    } else {
                        throw new Error("Text box is hidden.");
                    }
                } catch (err) {
                    console.error("Injection error:", err);
                    alert("Failed to inject text: " + err.message);
                }
            }
        });
    </script>
